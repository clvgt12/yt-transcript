# yt-transcribe-web — Docker Compose
#
# Services:
#   ollama      — Ollama inference server (GPU-enabled, internal only)
#   whisper     — Whisper transcription microservice (GPU-enabled, internal only)
#   web         — Streamlit web application (port 8501)
#
# Internal network: yt-transcribe-net (ollama and whisper not exposed on host)
#
# Host mounts:
#   ~/yt-transcribe/web/files    — transcription + summary output files
#   ~/.cache                     — Whisper model weight cache (XDG_CACHE_HOME=/whisper-cache → whisper/*.pt)
#   ollama Docker volume         — reuses existing cached Ollama models
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:8501
#
# Environment:
#   Create a .env file in this directory with:

networks:
  yt-transcribe-net:
    driver: bridge

services:
  # ── yt-dlp download microservice ────────────────────────────────────────────
  ytdlp:
    build:
      context: .
      dockerfile: Dockerfile.ytdlp
    image: yt-transcribe-ytdlp:latest
    container_name: yt-transcribe-ytdlp
    restart: unless-stopped
    networks:
      - yt-transcribe-net
    volumes:
      - ${HOME}/yt-transcribe/web/files:/files
    environment:
      YT_DLP_BIN:          /venv/bin/yt-dlp
      FILES_BASE:          /files
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_MS:    ${POLL_INTERVAL_MS:-2000}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Streamlit web application ───────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-transcribe-web:latest
    container_name: yt-transcribe-web-app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      whisper:
        condition: service_healthy
      ytdlp:
        condition: service_healthy
    networks:
      - yt-transcribe-net
    ports:
      - "8501:8501"
    volumes:
      - ${HOME}/yt-transcribe/web/files:/usr/app/files
    environment:
      # Transcription — handled by whisper-service container
      WHISPER_MODEL:          ${WHISPER_MODEL:-small}
      FORCE_WHISPER:          ${FORCE_WHISPER:-false}
      WHISPER_SERVICE_URL:    http://whisper:8000
      WHISPER_POLL_INTERVAL:  ${WHISPER_POLL_INTERVAL:-3}
      YTDLP_SERVICE_URL:      http://ytdlp:8001
      # Summarization
      SUMMARIZE:            ${SUMMARIZE:-true}
      OLLAMA_URL:             http://ollama:11434
      OLLAMA_PRIMARY_MODEL:   ${OLLAMA_PRIMARY_MODEL:-gpt-oss:120b-cloud}
      OLLAMA_FALLBACK_MODEL:  ${OLLAMA_FALLBACK_MODEL:-qwen3:1.7b}
      OLLAMA_API_KEY:         ${OLLAMA_API_KEY:-}
      FORCE_LOCAL_SUMMARY:    ${FORCE_LOCAL_SUMMARY:-false}
      # UI
      POLL_INTERVAL_MS:     ${POLL_INTERVAL_MS:-2000}
      CACHE_FILE_AGE_DAYS:  ${CACHE_FILE_AGE_DAYS:-30}
      WEB_SEARCH_ENABLED:   ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
